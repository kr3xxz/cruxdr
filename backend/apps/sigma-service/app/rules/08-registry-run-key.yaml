title: Registry Run Key Modification for Persistence
id: b8c9d0e1-f2a3-4b4c-8d5e-6f7a8b9c0d08
status: stable
description: Detects modifications to Registry Run keys enabling automatic execution at user logon. Attackers add entries to Run keys for long-term persistence across system reboots.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1547/001/
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_event
  product: windows
detection:
  selection:
    event_type: "persistence"
    category: "registry"
    registry.path: "CurrentVersion\\Run"
  condition: selection
falsepositives:
  - Legitimate software adding startup entries during installation
  - Users configuring convenience startup programs
level: high
mitre:
  technique: T1547.001
