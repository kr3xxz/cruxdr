title: Token Manipulation via SeDebugPrivilege Enable
id: f2a3b4c5-d6e7-4f8a-8b9c-0d1e2f3a4b12
status: stable
description: Detects processes enabling SeDebugPrivilege to manipulate security tokens. Attackers enable this privilege to perform token theft and impersonation for privilege escalation.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1134/001/
tags:
  - attack.privilege-escalation
  - attack.t1134.001
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    event_type: "privilege_escalation"
    action: "privilege_assignment"
  selection2:
    event_type: "privilege_escalation"
    process.name: "mimikatz.exe"
  condition: selection1 or selection2
falsepositives:
  - Legitimate debugging tools used by developers for software diagnostics
  - Performance monitoring tools that require process inspection
level: high
mitre:
  technique: T1134.001
