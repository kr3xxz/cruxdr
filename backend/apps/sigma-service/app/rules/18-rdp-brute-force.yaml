title: RDP Brute Force Authentication Attempts
id: f8a9b0c1-d2e3-4f4a-8b5c-6d7e8f9a0b18
status: stable
description: Detects multiple failed RDP authentication attempts from a single source IP indicative of brute force attack. Attackers brute force RDP credentials to gain initial access to target systems.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1110/
tags:
  - attack.credential-access
  - attack.t1110
logsource:
  category: authentication
  product: windows
detection:
  selection:
    event_type: "failed_login"
    category: "authentication"
    source.ip: "re:^192\\.168\\.|^10\\."
  condition: selection
falsepositives:
  - Users mistyping passwords during normal authentication
  - Misconfigured applications continuously attempting connections
level: high
mitre:
  technique: T1110
