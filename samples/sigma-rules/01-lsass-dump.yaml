title: LSASS Memory Dumping via procdump.exe
id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c01
status: stable
description: Detects the use of procdump.exe to dump the memory of the Local Security Authority Subsystem Service (LSASS) process. Attackers use this technique to extract credentials from LSASS memory for lateral movement and privilege escalation.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1003/001/
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  keywords:
    - "T1003.001-lsass"
    - "procdump"
falsepositives:
  - Legitimate administrative troubleshooting by IT staff
  - Approved security testing and penetration exercises
level: critical
