title: Kerberos Ticket Extraction from LSASS Memory
id: d4e5f6a7-b8c9-4d0e-8f1a-2b3c4d5e6f04
status: stable
description: Detects attempts to extract Kerberos ticket grant tickets and service tickets from LSASS process memory. Attackers extract Kerberos tickets to perform pass-the-ticket attacks and maintain persistent access to network resources.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1003/005/
tags:
  - attack.credential-access
  - attack.t1003.005
logsource:
  category: process_creation
  product: windows
detection:
  keywords:
    - "T1003.005-kerberos"
    - "ticket extract"
falsepositives:
  - Legitimate Kerberos troubleshooting by domain administrators
  - Security incident response forensic collection procedures
level: critical
