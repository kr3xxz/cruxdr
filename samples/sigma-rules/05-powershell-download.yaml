title: Malicious PowerShell Remote Download
id: e5f6a7b8-c9d0-4e1f-8a2b-3c4d5e6f7a05
status: stable
description: Detects PowerShell scripts that use the DownloadString method to retrieve payloads from remote web servers. Attackers frequently use this technique to download and execute malicious scripts in memory without writing artifacts to disk.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  keywords:
    - "T1059.001-powershell"
    - "DownloadString"
falsepositives:
  - Legitimate PowerShell scripts that download updates or configurations
  - Administrative automation scripts using web request methods
level: high
