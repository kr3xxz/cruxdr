title: Malicious PowerShell Remote Download
id: e5f6a7b8-c9d0-4e1f-8a2b-3c4d5e6f7a05
status: stable
description: Detects PowerShell scripts using DownloadString method to retrieve payloads from remote servers. Attackers use this to download stage-2 payloads directly into memory without touching disk.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: process_creation
  product: windows
detection:
  selection1:
    event_type: "execution"
    process.name: "powershell.exe"
    process.command_line: "contains|DownloadString|-enc"
  selection2:
    event_type: "execution"
    dns.question.name: "contains|evil.c2|evil|malicious"
  condition: selection1 or selection2
falsepositives:
  - Legitimate PowerShell automation downloading approved updates
  - Package managers using PowerShell web request cmdlets
level: critical
mitre:
  technique: T1059.001
