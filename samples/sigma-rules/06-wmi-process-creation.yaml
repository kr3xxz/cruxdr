title: WMI Process Creation via Win32_Process
id: f6a7b8c9-d0e1-4f2a-8b3c-4d5e6f7a8b06
status: stable
description: Detects remote process creation via WMI Win32_Process class method invocation. Attackers use WMI for stealthy execution and lateral movement without deploying traditional remote access tools.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1059/003/
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    event_type: "execution"
    action: "remote_process_creation"
    process.name: "wmic.exe"
  condition: selection
falsepositives:
  - Enterprise endpoint management solutions using WMI for inventory
  - IT automation scripts for legitimate remote administration
level: high
mitre:
  technique: T1059.003
