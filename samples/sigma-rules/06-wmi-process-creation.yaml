title: WMI Process Creation via Win32_Process
id: f6a7b8c9-d0e1-4f2a-8b3c-4d5e6f7a8b06
status: stable
description: Detects the creation of processes via Windows Management Instrumentation using the Win32_Process class. Attackers abuse WMI for remote execution and lateral movement without requiring traditional remote access tools or software.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1059/003/
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  keywords:
    - "T1059.003-wmi"
    - "Win32_Process"
falsepositives:
  - Legitimate WMI-based system management and monitoring solutions
  - Enterprise endpoint management software scheduled operations
level: high
