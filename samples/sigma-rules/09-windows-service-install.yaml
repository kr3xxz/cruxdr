title: Malicious Windows Service Installation via sc.exe
id: c9d0e1f2-a3b4-4c5d-8e6f-7a8b9c0d1e09
status: stable
description: Detects the installation of new Windows services using the sc.exe command-line utility. Attackers create malicious services to establish persistence with SYSTEM-level privileges and execute payloads on compromised hosts.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1543/003/
tags:
  - attack.persistence
  - attack.t1543.003
logsource:
  category: process_creation
  product: windows
detection:
  keywords:
    - "T1543.003-service"
    - "sc create"
falsepositives:
  - Legitimate software installations that register system services
  - Security tool deployments requiring Windows service registration
level: high
