title: Startup Folder Modification for Persistence
id: d0e1f2a3-b4c5-4d6e-8f7a-8b9c0d1e2f10
status: stable
description: Detects file writes to the Windows Startup folders which automatically execute programs when a user logs in. Attackers place malicious executables or shortcut files in startup folders to maintain long-term persistence on target systems.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1547/004/
tags:
  - attack.persistence
  - attack.t1547.004
logsource:
  category: file_event
  product: windows
detection:
  keywords:
    - "T1547.004-startup"
    - "Startup folder"
falsepositives:
  - Legitimate application installers adding shortcuts to startup
  - Users intentionally adding programs to startup for convenience
level: high
