title: Token Manipulation via SeDebugPrivilege Enable
id: f2a3b4c5-d6e7-4f8a-8b9c-0d1e2f3a4b12
status: stable
description: Detects processes enabling the SeDebugPrivilege token privilege which grants access to debug and manipulate other processes. Attackers enable this privilege to perform token theft and impersonation for privilege escalation against higher-integrity processes.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1134/001/
tags:
  - attack.privilege-escalation
  - attack.t1134.001
logsource:
  category: process_creation
  product: windows
detection:
  keywords:
    - "T1134.001-token"
    - "SeDebugPrivilege"
falsepositives:
  - Legitimate system diagnostics and performance monitoring tools
  - Debugging tools used by software developers for troubleshooting
level: high
