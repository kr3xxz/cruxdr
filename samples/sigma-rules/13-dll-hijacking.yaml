title: DLL Search Order Hijacking Detection
id: a3b4c5d6-e7f8-4a9b-8c0d-1e2f3a4b5c13
status: stable
description: Detects indicators of DLL search order hijacking where attackers place a malicious DLL in a directory searched before the legitimate system DLL. This technique allows code execution with the privileges of the calling process without requiring explicit code injection.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1574/001/
tags:
  - attack.privilege-escalation
  - attack.t1574.001
logsource:
  category: image_load
  product: windows
detection:
  keywords:
    - "T1574.001-dll"
    - "DLL hijack"
falsepositives:
  - Software applications that bundle custom DLL versions for compatibility
  - Legitimate DLL sideloading by approved vendor applications and plugins
level: high
