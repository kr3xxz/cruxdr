title: Event Log Clearing via wevtutil.exe
id: d6e7f8a9-b0c1-4d2e-8f3a-4b5c6d7e8f16
status: stable
description: Detects the clearing of Windows Event Logs using the wevtutil command-line utility with the cl parameter. Attackers clear event logs to destroy forensic evidence of their activities and evade detection by security monitoring and SIEM systems.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1070/001/
tags:
  - attack.defense-evasion
  - attack.t1070.001
logsource:
  category: process_creation
  product: windows
detection:
  keywords:
    - "T1070.001-evtx"
    - "wevtutil cl"
falsepositives:
  - System administrators clearing logs for routine disk space maintenance
  - Automated log rotation scripts configured by IT operations teams
level: critical
