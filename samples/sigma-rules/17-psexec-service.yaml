title: PsExec Service Creation for Lateral Movement
id: e7f8a9b0-c1d2-4e3f-8a4b-5c6d7e8f9a17
status: stable
description: Detects PsExec service creation indicating lateral movement via Sysinternals PsExec tool. Attackers abuse PsExec to execute commands on remote systems after gaining initial foothold.
author: CruXDR SOC Team
date: 2026-06-28
references:
  - https://attack.mitre.org/techniques/T1021/002/
tags:
  - attack.lateral-movement
  - attack.t1021.002
logsource:
  category: service_creation
  product: windows
detection:
  selection:
    event_type: "lateral_movement"
    action: "service_creation"
    process.name: "PSEXESVC.exe"
  condition: selection
falsepositives:
  - IT support staff using PsExec for approved remote administration
  - Automated deployment tools using PsExec for software distribution
level: high
mitre:
  technique: T1021.002
